spring:
  application:
    name: order-application

  config:
    import:
      - optional:file:.env[.properties]

  main:
    banner-mode: off

  datasource:
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://${POSTGRES_HOST}/${POSTGRES_DB}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    url: jdbc:postgresql://${POSTGRES_HOST}/${POSTGRES_DB}
    user: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    enabled: true
    locations: classpath:db/migration

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
        base-path: /actuator
    endpoint:
      health:
        show-details: always
        probes:
          enabled: true
    server:
      port: 8081

logging:
  level:
    db: debug
